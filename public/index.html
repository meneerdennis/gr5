<!doctype html>

  <head>
    <meta charset="utf-8" />
    <link rel="icon" href="%PUBLIC_URL%/favicon.ico" />
    <link rel="manifest" href="%PUBLIC_URL%/manifest.json" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <meta name="theme-color" content="#0f172a" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta
      name="apple-mobile-web-app-status-bar-style"
      content="black-translucent"
    />
    <meta name="apple-mobile-web-app-title" content="GR5" />
    <link rel="apple-touch-icon" href="%PUBLIC_URL%/appicon.png" />
    <meta
      name="description"
      content="Volg mijn GR5-wandeltocht in realtime! Op MijnGR5.be deel ik foto’s, korte updates en mijn dagelijkse voortgang langs de beroemde GR5-route. Ontdek de mooiste landschappen, leer meer over het wandelen van de GR5 en volg hoe ik stap voor stap mijn avontuur volbreng. Ideaal voor familie, vrienden en alle wandelliefhebbers die het GR5-pad willen volgen."
    />
    <title>Mijn GR5 Avontuur</title>

    <!-- Preload critical resources -->
    <link rel="dns-prefetch" href="//fonts.googleapis.com" />
    <link rel="dns-prefetch" href="//www.googletagmanager.com" />

    <!-- Keep only the most critical preconnects (max 4) -->
    <link
      rel="preconnect"
      href="https://gr-5-4df65.firebaseapp.com"
      crossorigin
    />
    <link
      rel="preconnect"
      href="https://identitytoolkit.googleapis.com"
      crossorigin
    />
    <!-- Demoted apis.google.com to dns-prefetch (used only for optional Google Sign-In) -->
    <link rel="dns-prefetch" href="//apis.google.com" />
    <link
      rel="preconnect"
      href="https://a.tile.openstreetmap.org"
      crossorigin
    />

    <!-- Preload the first OpenStreetMap tile to make the LCP tile discoverable (mobile) -->
    <link
      rel="preload"
      as="image"
      href="https://a.tile.openstreetmap.org/5/16/11.png"
      crossorigin
      fetchpriority="high"
    />
    <script>
      // Create a high-priority image fetch for the LCP tile so browsers start it early.
      (function () {
        try {
          const img = new Image();
          img.decoding = "async";
          // Ensure preload / programmatic fetch use same CORS semantics so the preload can be reused.
          if ("crossOrigin" in img) img.crossOrigin = "anonymous";
          // Hint the browser to prioritize this fetch when supported.
          if (typeof img.setAttribute === "function") {
            try {
              img.setAttribute("fetchpriority", "high");
            } catch (e) {}
          }
          img.src = "https://a.tile.openstreetmap.org/5/16/11.png";
        } catch (e) {
          // swallow errors in old browsers
        }
      })();
    </script>

    <!-- Keep www.googleapis.com as preconnect because Firebase may call it early -->
    <link rel="preconnect" href="https://www.googleapis.com" crossorigin />
    <link rel="dns-prefetch" href="//firestore.googleapis.com" />
    <link rel="dns-prefetch" href="//firebasestorage.googleapis.com" />
    <link rel="dns-prefetch" href="//b.tile.openstreetmap.org" />
    <link rel="dns-prefetch" href="//c.tile.openstreetmap.org" />
    <!-- Google tag (gtag.js) -->
    <script
      async
      src="https://www.googletagmanager.com/gtag/js?id=G-WQW6GWLS5Q"
    ></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag() {
        dataLayer.push(arguments);
      }
      gtag("js", new Date());
      gtag("config", "G-WQW6GWLS5Q");
    </script>
    <!-- Inline small Firebase runtime config to avoid an extra head fetch -->
    <script>
      window.__FIREBASE_CONFIG__ = {
        apiKey: "AIzaSyC6nE2hjCvcGTz-VeCbrpycDwIzqzIvIV8",
        authDomain: "gr-5-4df65.firebaseapp.com",
        projectId: "gr-5-4df65",
        storageBucket: "gr-5-4df65.firebasestorage.app",
        messagingSenderId: "843113923788",
        appId: "1:843113923788:web:4d4e87dfff681460bd6e69",

    <!-- Preload compiled main CSS early (points to current build filename) -->

      rel="preload"
      href="%PUBLIC_URL%/static/css/main.7108f2ce.css"

      onload="this.rel = 'stylesheet'"

    </noscript>

    <!-- Critical mobile CSS inlined to speed up first render -->
    <style>
      /* Mobile Travel Journal Button - critical subset inlined for faster paint */
      @media (max-width: 768px) {
        .unified-journal-button .travel-journal-text {
          display: none !important;
        }
        .unified-journal-button {
          gap: 0 !important;
          padding: 6px !important;
        }
        .journal-icon-image {
          width: 44px !important;
          height: 44px !important;
        }
      }
      @media (max-width: 640px) {
        .unified-journal-button {
          padding: 4px !important;
        }
        .journal-icon-image {
          width: 40px !important;
          height: 40px !important;
        }
      }
    </style>
